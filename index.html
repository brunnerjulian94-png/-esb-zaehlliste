<script>
(function(){
  if(window.AndroidApp) return;
  const handlers=window.webkit&&window.webkit.messageHandlers;
  if(!handlers) return;
  const post=(name,args)=>{ const h=handlers&&handlers[name]; if(h) h.postMessage(args||{}); };
  window.AndroidApp={
    loadData:function(){ try{return localStorage.getItem("esb_data")||"";}catch(e){return "";} },
    saveData:function(json){ try{localStorage.setItem("esb_data",json);}catch(e){} post("saveData",{json:String(json||"")}); },
    openExactHtmlPdf:function(title,html){ post("openExactHtmlPdf",{title:title||"",html:html||""}); },
    sendExactHtmlPdfEmail:function(title,html,text){ post("sendExactHtmlPdfEmail",{title:title||"",html:html||"",text:text||""}); },
    printHtml:function(jobName,html){ post("openExactHtmlPdf",{title:jobName||"",html:html||""}); },
    sharePdfHtml:function(title,html,text){ post("sendExactHtmlPdfEmail",{title:title||"",html:html||"",text:text||""}); },
    printPage:function(jobName){ post("printPage",{title:jobName||""}); },
    sharePdf:function(title,text){ post("shareText",{title:title||"",text:text||""}); },
    shareText:function(title,text){ post("shareText",{title:title||"",text:text||""}); },
    sendEmail:function(title,text){ post("shareText",{title:title||"",text:text||""}); },
    saveBackup:function(json){ post("saveBackup",{json:String(json||"")}); }
  };
})();
</script>

function normalizeSearch(s){
 return String(s||"")
   .toLowerCase()
   .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
   .replace(/ß/g,"ss")
   .replace(/[^a-z0-9 ]/g,"")
   .replace(/\s+/g," ")
   .trim();
}
function editDistance(a,b){
 a=normalizeSearch(a);b=normalizeSearch(b);
 const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=0;i<=m;i++)dp[i][0]=i;
 for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
   dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[m][n];
}
function searchMatches(query,text){
 const q=normalizeSearch(query),t=normalizeSearch(text);
 if(!q)return true;
 if(t.includes(q)||q.includes(t))return true;
 return q.length>=4&&editDistance(q,t)<=2;
}

function isBlankStartProject(c){
 if(!c||!c.startPlaceholder)return false;
 const hasMeta=String(c.project||"").trim()||String(c.address||"").trim()||String(c.note||"").trim();
 const hasApartmentNames=c.apartmentCustomers&&Object.values(c.apartmentCustomers).some(v=>String(v||"").trim());
 const hasCounts=(c.rooms||[]).some(r=>(r.groups||[]).some(g=>(g.items||[]).some(i=>Number(i.count||0)>0)));
 return !hasMeta&&!hasApartmentNames&&!hasCounts;
}

function buildDetailedOrderData(){
 const c=C(),apartments=[],grand={},categoryOrder=[],apartmentMap={};
 (c.rooms||[]).forEach(r=>{
   const cats=[];
   (r.groups||[]).forEach(g=>{
     const used=(g.items||[]).filter(i=>Number(i.count||0)>0);
     if(!used.length)return;
     const items=used.map(i=>({name:i.name,count:Number(i.count||0),unit:unitForItem(i.name)}));
     cats.push({title:g.title,items});
     if(!grand[g.title]){grand[g.title]={};categoryOrder.push(g.title);}
     items.forEach(i=>{
       if(!grand[g.title][i.name])grand[g.title][i.name]={count:0,unit:i.unit};
       grand[g.title][i.name].count+=i.count;
     });
   });
   if(!cats.length)return;
   const apName=r.apartment||"Allgemein";
   if(!apartmentMap[apName]){
     apartmentMap[apName]={name:apName,customerName:apartmentCustomerName(apName),rooms:[],totals:{},totalOrder:[]};
     apartments.push(apartmentMap[apName]);
   }
   const ap=apartmentMap[apName];
   ap.rooms.push({name:r.name,categories:cats});
   cats.forEach(cat=>{
     if(!ap.totals[cat.title]){ap.totals[cat.title]={};ap.totalOrder.push(cat.title);}
     cat.items.forEach(i=>{
       if(!ap.totals[cat.title][i.name])ap.totals[cat.title][i.name]={count:0,unit:i.unit};
       ap.totals[cat.title][i.name].count+=i.count;
     });
   });
 });
 return {customer:c,apartments,grand,categoryOrder};
}
function formatQty(v,u){
 return u==="m" ? String(Math.round(Number(v||0)*100)/100).replace(".",",") : String(Math.round(Number(v||0)));
}

 });
 lines.push("HAUPTLISTE / GESAMTSUMME PROJEKT");
 d.categoryOrder.forEach(cat=>{

function aggregate(){const c=C(),tot={},order=[];c.rooms.forEach(r=>r.groups.forEach(g=>{if(!tot[g.title]){tot[g.title]={};order.push(g.title)}g.items.forEach(i=>tot[g.title][i.name]=(tot[g.title][i.name]||0)+Number(i.count||0))}));return{c,tot,order}}
function renderSummary(){const{c,tot,order}=aggregate();summary.innerHTML="";printHead.innerHTML=`<div style="font-size:13px;font-weight:700;color:#555">KUNDE / PROJEKT</div><h1 style="margin:2px 0 8px;font-size:26px">${esc(c.name)}</h1>${c.project?`<div><b>Projekt:</b> ${esc(c.project)}</div>`:""}${c.address?`<div><b>Adresse:</b> ${esc(c.address)}</div>`:""}<div><b>Schalterprogramm:</b> ${esc(c.brand)}</div><div><b>Datum:</b> ${currentDateDE()}</div>${c.note?`<div><b>Notiz:</b> ${esc(c.note)}</div>`:""}`;let any=false;order.forEach(k=>{const u=Object.entries(tot[k]).filter(x=>x[1]>0);if(!u.length)return;any=true;const h=document.createElement("div");h.className="sectionTitle";h.style.marginTop="12px";h.textContent=k;summary.appendChild(h);u.forEach(([n,v])=>{const e=document.createElement("div");e.className="sum";e.innerHTML=`<span>${esc(n)}</span><b>${v}</b>`;summary.appendChild(e)})});if(!any)summary.innerHTML='<span style="color:#94a3b8">Noch nichts gezählt.</span>'}
function listText(){const{c,tot,order}=aggregate(),a=[`BESTELLLISTE – ${c.name}`,`Schalterprogramm: ${c.brand}`];if(c.project)a.push(`Projekt: ${c.project}`);if(c.address)a.push(`Adresse: ${c.address}`);a.push(`Datum: ${currentDateDE()}`);a.push("");order.forEach(k=>{const u=Object.entries(tot[k]).filter(x=>x[1]>0);if(!u.length)return;a.push(k.toUpperCase());u.forEach(([n,v])=>a.push(`${n}: ${v}`));a.push("")});return a.join("\n")}
async function copyList(){
 const text=detailedOrderText();
 try{await navigator.clipboard.writeText(text);alert("Bestellliste kopiert.");}
 catch(e){modal("Bestellliste",`<textarea style="height:260px">${esc(text)}</textarea>`,closeModal);}
}
function buildPdfDocumentHtml(){
 let css=[...document.querySelectorAll("style")].map(s=>s.textContent||"").join("\\n");
 // The Android PDF WebView renders off-screen in screen mode.
 // Apply the print rules there as normal rules so PDF and print look identical.
 css=css.replace(/@media\\s+print\\s*\\{/g,"@media all{");
 return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}</style></head><body><div id="printHead">${detailedPrintHtml()}</div></body></html>`;
}

function pdfSafeText(value){
  return String(value==null?"":value).replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim();
}
function pdfFileBaseName(){
  const c=C();
  const raw=`ESB_Bestellliste_${(c&&((c.project||c.name)))||"Projekt"}_${currentDateISO()}`;
  return raw.replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"_").slice(0,100);
}
function winAnsiBytes(str){
  const extra={8364:128,8218:130,402:131,8222:132,8230:133,8224:134,8225:135,710:136,8240:137,352:138,8249:139,338:140,381:142,8216:145,8217:146,8220:147,8221:148,8226:149,8211:150,8212:151,732:152,8482:153,353:154,8250:155,339:156,382:158,376:159};
  const out=[];
  for(const ch of String(str)){
    const cp=ch.codePointAt(0);
    if(cp<=255) out.push(cp);
    else if(extra[cp]!=null) out.push(extra[cp]);
    else out.push(63);
  }
  return new Uint8Array(out);
}
function pdfEscapeText(str){
  return pdfSafeText(str).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}
function pdfApproxWidth(text,size){
  return pdfSafeText(text).length*size*0.50;
}
function base64ToBytes(b64){
  const bin=atob(b64),out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}

function buildProfessionalPdfBlob(){
  const d=buildDetailedOrderData(),c=d.customer;
  const W=595,H=842,left=42,right=553,contentW=right-left;
  const blue=[0.13,0.35,0.62],green=[0.48,0.67,0.18],dark=[0.08,0.11,0.17],muted=[0.38,0.43,0.50],light=[0.95,0.97,0.99],lineCol=[0.84,0.87,0.91];
  const pages=[];
  let ops=[],y=0,pageNo=0,currentSection="",currentSubtitle="";
  const color=c=>`${c[0]} ${c[1]} ${c[2]}`;
  const line=(x1,y1,x2,y2,w=0.6,col=lineCol)=>ops.push(`${w} w ${color(col)} RG ${x1} ${y1} m ${x2} ${y2} l S`);
  const rect=(x,yy,w,h,fill,stroke=null,sw=0.6)=>{ops.push(`${color(fill)} rg ${x} ${yy} ${w} ${h} re f`);if(stroke)ops.push(`${sw} w ${color(stroke)} RG ${x} ${yy} ${w} ${h} re S`)};
  const text=(x,yy,txt,size=10,bold=false,col=dark)=>{
    const safe=pdfEscapeText(txt);
    ops.push(`${color(col)} rg BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${safe}) Tj ET`);
  };
  const rightText=(xRight,yy,txt,size=10,bold=false,col=dark)=>{
    const x=Math.max(left,xRight-pdfApproxWidth(txt,size)); text(x,yy,txt,size,bold,col);
  };
  const drawLogo=(x,yy,w)=>{const h=w*263/700;ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${yy.toFixed(2)} cm /Im1 Do Q`);};
  const footer=()=>{
    line(left,35,right,35,0.7,blue);
    text(left,20,"Elektro Stampfl & Brunner",8,true,blue);
    text(left+132,20,`ESB Zählliste · ${currentDateDE()}`,8,false,muted);
    rightText(right,20,`Seite ${pageNo}`,8,true,muted);
  };
  function startPage(sectionTitle,subtitle){
    if(ops.length){footer();pages.push(ops.join("\n"));}
    ops=[]; pageNo++; currentSection=sectionTitle||currentSection; currentSubtitle=subtitle||currentSubtitle;
    drawLogo(left,786,116);
    text(left+132,816,"ELEKTRO STAMPFL & BRUNNER",13,true,dark);
    text(left+132,799,"BESTELL- & MENGENÜBERSICHT",8,true,muted);
    rect(left+132,789,contentW-132,2,green);
    rightText(right,816,currentDateDE(),8,false,muted);
    rect(left,744,contentW,33,blue);
    text(left+12,756,currentSection,17,true,[1,1,1]);
    if(currentSubtitle)rightText(right-12,757,currentSubtitle,8,false,[1,1,1]);
    y=724;
  }
  function ensure(h,sectionTitle=currentSection,subtitle=currentSubtitle){if(y-h<50)startPage(sectionTitle,subtitle);}
  function metaGrid(){
    rect(left,y-60,contentW,64,light,lineCol);
    const x1=left+12,x2=left+285; let yy=y-14;
    const pair=(lx,lv,rx,rv)=>{
      text(x1,yy,lx,8,true,muted); text(x1+92,yy,pdfSafeText(lv)||"–",9,false,dark);
      text(x2,yy,rx,8,true,muted); text(x2+88,yy,pdfSafeText(rv)||"–",9,false,dark); yy-=17;
    };
    pair("Kunde / Projekt",c.name||"","Projekt",c.project||"");
    pair("Adresse",c.address||"","Schalterprogramm",c.brand||"");
    pair("Datum",currentDateDE(),"Wohnungen",String(d.apartments.length));
    y-=72;
  }
  function categoryBar(txt){ensure(21);rect(left,y-4,contentW,17,[0.91,0.94,0.97]);text(left+8,y+1,pdfSafeText(txt).toUpperCase(),8,true,dark);y-=19;}
  function itemRow(name,qty,greenRow=false){ensure(17);if(greenRow)rect(left,y-4,contentW,15,[0.94,0.98,0.92]);text(left+8,y,pdfSafeText(name),9,greenRow,dark);rightText(right-8,y,pdfSafeText(qty),9,true,dark);line(left,y-5,right,y-5,0.35,[0.90,0.92,0.94]);y-=15;}
  function sectionBar(title,extra="",greenBar=false){ensure(31);rect(left,y-5,contentW,24,greenBar?green:blue);text(left+10,y+2,pdfSafeText(title),12,true,[1,1,1]);if(extra)rightText(right-10,y+3,pdfSafeText(extra),8,false,[1,1,1]);y-=32;}
  function roomTitle(title){ensure(24);text(left,y,pdfSafeText(title),11,true,dark);line(left,y-5,right,y-5,0.6,[0.74,0.79,0.85]);y-=18;}
  function roomEstimate(r){let rows=0,cats=0;r.categories.forEach(cat=>{cats++;rows+=cat.items.length});return 26+cats*19+rows*15;}
  function flatGrand(){const out=[];d.categoryOrder.forEach(cat=>Object.entries(d.grand[cat]||{}).forEach(([name,o])=>{if(Number(o.count||0)>0)out.push({cat,name,...o})}));return out;}
  function unitTotals(){let pieces=0,meters=0;flatGrand().forEach(i=>{if(i.unit==="m")meters+=Number(i.count||0);else pieces+=Number(i.count||0)});return{pieces,meters};}

  // 1) Gesamtbestellliste zuerst
  startPage("GESAMTBESTELLLISTE",pdfSafeText(c.project||c.name||"Projekt"));
  metaGrid();
  const units=unitTotals();
  rect(left,y-2,contentW,42,[0.93,0.98,0.90],[0.73,0.84,0.62]);
  text(left+14,y+12,"GESAMTSTÜCKZAHL",10,true,dark);
  text(left+145,y+8,String(Math.round(units.pieces)),22,true,blue);
  text(left+205,y+12,"Stk.",10,true,dark);
  if(units.meters>0){text(left+300,y+12,"GESAMTMETER",10,true,dark);text(left+405,y+8,formatQty(units.meters,"m"),18,true,blue);text(left+465,y+12,"m",10,true,dark);}
  y-=58;
  d.categoryOrder.forEach(cat=>{
    const used=Object.entries(d.grand[cat]||{}).filter(([_,o])=>Number(o.count||0)>0);
    if(!used.length)return;
    categoryBar(cat);
    used.forEach(([name,o])=>itemRow(name,`${formatQty(o.count,o.unit)} ${o.unit}`));
    y-=5;
  });

  // 2) Detailnachweis Wohnungen / Räume
  startPage("DETAILNACHWEIS",pdfSafeText(c.project||c.name||"Projekt"));
  d.apartments.forEach((ap,apIndex)=>{
    if(apIndex>0 && y<150)startPage("DETAILNACHWEIS",pdfSafeText(c.project||c.name||"Projekt"));
    sectionBar(ap.name,ap.customerName?`Bewohner: ${ap.customerName}`:"");
    ap.rooms.forEach(r=>{
      const est=roomEstimate(r);
      if(est<620 && y-est<55)startPage("DETAILNACHWEIS",`${ap.name} · ${pdfSafeText(c.project||c.name||"Projekt")}`);
      roomTitle(r.name);
      r.categories.forEach(cat=>{
        categoryBar(cat.title);
        cat.items.forEach(i=>itemRow(i.name,`${formatQty(i.count,i.unit)} ${i.unit}`));
      });
      y-=7;
    });
    ensure(38,"DETAILNACHWEIS",pdfSafeText(c.project||c.name||"Projekt"));
    sectionBar(`SUMME ${ap.name}`,"",true);
    ap.totalOrder.forEach(cat=>{
      const used=Object.entries(ap.totals[cat]||{}).filter(([_,o])=>Number(o.count||0)>0);
      if(!used.length)return;
      categoryBar(cat);
      used.forEach(([name,o])=>itemRow(name,`${formatQty(o.count,o.unit)} ${o.unit}`,true));
    });
    y-=12;
  });

  footer(); pages.push(ops.join("\n"));

  // PDF objects incl. ESB logo JPEG
  const objects=[];
  objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
  const font1=3,font2=4,logoObj=5;
  objects[font1]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[font2]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objects[logoObj]={stream:base64ToBytes(ESB_PDF_LOGO_B64),dict:`/Type /XObject /Subtype /Image /Width 700 /Height 263 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`};
  const kids=[]; let objNo=6;
  for(const content of pages){
    const contentNo=objNo++, pageObjNo=objNo++;
    const contentBytes=winAnsiBytes(content);
    objects[contentNo]={stream:contentBytes,dict:""};
    objects[pageObjNo]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> /XObject << /Im1 ${logoObj} 0 R >> >> /Contents ${contentNo} 0 R >>`;
    kids.push(`${pageObjNo} 0 R`);
  }
  objects[2]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`;
  const chunks=[];let offset=0;const offsets=[];
  const pushBytes=b=>{chunks.push(b);offset+=b.length};
  const pushStr=t=>pushBytes(winAnsiBytes(t));
  pushStr("%PDF-1.4\n%âãÏÓ\n");
  for(let i=1;i<objects.length;i++){
    if(!objects[i])continue;
    offsets[i]=offset;pushStr(`${i} 0 obj\n`);
    if(typeof objects[i]==="string"){pushStr(objects[i]+"\nendobj\n");}
    else{
      const b=objects[i].stream,dict=objects[i].dict?objects[i].dict+" ":"";
      pushStr(`<< ${dict}/Length ${b.length} >>\nstream\n`);pushBytes(b);pushStr("\nendstream\nendobj\n");
    }
  }
  const xref=offset;pushStr(`xref\n0 ${objects.length}\n0000000000 65535 f \n`);
  for(let i=1;i<objects.length;i++)pushStr(String(offsets[i]||0).padStart(10,"0")+" 00000 n \n");
  pushStr(`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:"application/pdf"});
}
function openProfessionalPdf(){
  const blob=buildProfessionalPdfBlob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.target="_blank"; a.rel="noopener"; a.download=pdfFileBaseName()+".pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function buildEmailPdfData(){
 const d=buildDetailedOrderData(),c=d.customer;
 const out={
   title:`ESB Zählliste - ${c.project||c.name||"Projekt"}`,
   customer:c.name||"",
   project:c.project||"",
   brand:c.brand||"",
   date:currentDateDE(),
   apartments:[],
   grand:[]
 };

 d.apartments.forEach(ap=>{
   const a={
     name:ap.name,
     customerName:ap.customerName||"",
     rooms:[],
     totals:[]
   };

   ap.rooms.forEach(r=>{
     const items=[];
     r.categories.forEach(cat=>{
       cat.items.forEach(i=>{
         items.push({name:i.name,count:Number(i.count||0),unit:i.unit||"Stk."});
       });
     });
     a.rooms.push({name:r.name,items});
   });

   ap.totalOrder.forEach(cat=>{
     Object.entries(ap.totals[cat]||{}).forEach(([name,o])=>{
       if(Number(o.count||0)>0){
         a.totals.push({name,count:Number(o.count||0),unit:o.unit||"Stk."});
       }
     });
   });

   out.apartments.push(a);
 });

 d.categoryOrder.forEach(cat=>{
   Object.entries(d.grand[cat]||{}).forEach(([name,o])=>{
     if(Number(o.count||0)>0){
       out.grand.push({name,count:Number(o.count||0),unit:o.unit||"Stk."});
     }
   });
 });

 return JSON.stringify(out);
}

async function shareList(){
  if(!C()){
    alert("Bitte zuerst ein Projekt auswählen.");
    return;
  }
  try{
    const blob=buildProfessionalPdfBlob();
    const file=new File([blob],pdfFileBaseName()+".pdf",{type:"application/pdf"});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:`ESB Bestellliste - ${C().name}`,text:"ESB Bestellliste als PDF",files:[file]});
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=file.name; a.target="_blank"; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    alert("PDF wurde erstellt. Du kannst sie jetzt über das iPad-Teilen-Menü per E-Mail senden.");
  }catch(e){
    if(e && e.name==="AbortError") return;
    console.error(e);
    alert("Teilen war nicht möglich. Bitte zuerst 'Bestellliste / PDF öffnen' verwenden.");
  }
}

function migrateCompleteCatalog(){
 const defs=[["Schalter & Steckdosen",["Schukosteckdose","Wechselschalter","Kreuzschalter","Serienschalter","Doppelwechselschalter","Rolloschalter","Rollotaster","Taster normal","Thermostate","Hauptthermostat","CAT6 Steckdosen","TV Steckdose","Zentral UAE 1-fach","Zentral UAE 2-fach","TV zentral","Blindabdeckung","USB Steckdose","Kabelauslass"]],["Wippen",["1-fach Wippen","Serienwippe","Jalousiewippe","Wippe mit Schriftfeld"]],["Auslässe",["LED Auslass","Lichtauslass","Auslass Markise","Auslass Abzugshaube","Auslass Kochinsel","Auslass Ventilator","Auslass Lüftung","Auslass Klimagerät","Auslass Alarmkontakt","Auslass Bedienteil Alarm","Auslass Außensirene Alarm","Auslass Bewegungsmelder Alarm","Auslass Zentrale Alarm","Auslass Kamera","Außenfühler","Auslass Innensirene Alarm","Auslass Schacht Garten","Leerrohrauslass"]],["Verteiler",["LS 10 A", "LS 16 A", "FI 40 A / 30 mA", "FI/LS 10 A", "FI/LS 16 A", "Hauptschalter", "Überspannungsschutz", "Klingeltrafo", "Schütz", "Stromstoßschalter", "Astrouhr", "Uhr", "Striebel & John 3 Reihig", "Striebel & John 4 Reihig", "Striebel & John Multimediaverteiler","LS 10 A 4 pol","LS 16 A 4 pol","FI Schutzschalter 40 A 4 pol","FI Schutzschalter 40 A 2 pol","Kippschalter 40 A 2 pol","Kippschalter 40 A 4 pol"]],["KNX – Verteilung",["Spannungsversorgung","Gira X1","Gira S1","Spannungsversorgung Wetterstation","Wetterstation","Heizungsaktor","Schaltaktor 8-fach","Schaltaktor 24-fach","Jalousieaktor","Dimmaktor","Binäreingang 24 V","Binäreingang 230 V","DALI Gateway"]],["KNX – Schaltung",["Tastsensor 1-fach","Tastsensor 2-fach","Tastsensor 3-fach","Tastsensor 4-fach","BA Taster 1-fach","BA Taster 2-fach","Thermostat Bus","Gira G1"]],["Beleuchtung",["Brilux Einbaustrahler","LED Strip","LED Schiene + Abdeckung Brilux U1","Kaiser Halox Dose"]],["Sonstiges",["Videosprechanlage","Notlampe Wand","Unterputznotlampe","Abzweigdose PT 3","Abzweigdose PT 4","Abzweigdose PT 5","Abzweigdose PT 6","Abzweigdose PT 7","Abzweigdose PT 8","Abzweigdose PT 9","Abzweigdose PT 10","Abzweigdose PT 11","Bewegungsmelder 360 ° unterputz","Bewegungsmelder 1,10 Mt unterputz","Verteilung TV"]]];
 const standardFrames=["1-fach Rahmen","2-fach Rahmen","3-fach Rahmen","4-fach Rahmen","5-fach Rahmen","503 Rahmen","504 Rahmen","507 Rahmen"];

 data.customers.forEach(c=>{
   if(!c.brand)c.brand="Gira";
   if(!Array.isArray(c.rooms))c.rooms=[];

   c.rooms.forEach(r=>{
     if(!Array.isArray(r.groups))r.groups=[];

     // Move legacy Videosprechanlage from Schalter to Sonstiges, preserving its count.
     let legacyVideoCount=0;
     const switchGroup=r.groups.find(g=>g.title==="Schalter & Steckdosen");
     if(switchGroup&&Array.isArray(switchGroup.items)){
       const oldVideo=switchGroup.items.find(i=>i.name==="Videosprechanlage");
       if(oldVideo)legacyVideoCount=Number(oldVideo.count||0);
       switchGroup.items=switchGroup.items.filter(i=>i.name!=="Videosprechanlage");
     }

     // Merge every standard category and item. Own/custom items remain untouched.
     defs.forEach(([title,names])=>{
       let g=r.groups.find(x=>x.title===title);
       if(!g){
         g={title,items:[]};
         r.groups.push(g);
       }
       if(!Array.isArray(g.items))g.items=[];

       names.forEach(name=>{
         const exists=g.items.some(i=>String(i.name).toLowerCase()===String(name).toLowerCase());
         if(!exists)g.items.push({name,count:0});
       });
     });

     // Restore/move Videosprechanlage count into Sonstiges if it existed in an old version.
     if(legacyVideoCount>0){
       const sg=r.groups.find(g=>g.title==="Sonstiges");
       const vi=sg.items.find(i=>i.name==="Videosprechanlage");
       if(vi)vi.count=Math.max(Number(vi.count||0),legacyVideoCount);
     }

     // Brand-correct frames only.
     let fg=r.groups.find(g=>g.title==="Rahmen");
     if(!fg){
       fg={title:"Rahmen",items:[]};
       r.groups.push(fg);
     }
     const wanted=(frameMap[c.brand]||frameMap.Gira);
     const counts={};
     fg.items.forEach(i=>counts[i.name]=Number(i.count||0));
     const customFrames=fg.items.filter(i=>!standardFrames.includes(i.name));
     fg.items=[
       ...wanted.map(name=>({name,count:counts[name]||0})),
       ...customFrames
     ];

     // Remove accidental duplicates in all categories, preserving the first count.
     r.groups.forEach(g=>{
       const seen=new Map();
       (g.items||[]).forEach(i=>{
         const key=String(i.name).trim().toLowerCase();
         if(!seen.has(key))seen.set(key,{name:i.name,count:Number(i.count||0)});
         else seen.get(key).count+=Number(i.count||0);
       });
       g.items=[...seen.values()];
     });
   });
 });
 save();
}
migrateCompleteCatalog();

   const brand=String(c.brand||"").trim().toLowerCase();
   let g=r.groups.find(x=>x.title==="Schalter & Steckdosen");
   if(!g){g={title:"Schalter & Steckdosen",items:[]};r.groups.push(g);}
   if(!Array.isArray(g.items))g.items=[];

   const removeNames=[
     "lichtsteckdosen 10 a",
     "lichtsteckdosen 10/16 a",
     "berker radio"
   ];
   g.items=g.items.filter(i=>{
     const n=String(i.name||"").trim().toLowerCase();
     if(brand==="bticino"||brand==="vimar"){
       return n!=="berker radio";
     }
     if(brand==="berker"){
       return n!=="lichtsteckdosen 10 a" && n!=="lichtsteckdosen 10/16 a";
     }
     return !removeNames.includes(n);
   });

   const wanted=[];
   if(brand==="bticino"||brand==="vimar"){
     wanted.push("Lichtsteckdosen 10 A","Lichtsteckdosen 10/16 A");
   }
   if(brand==="berker"){
     wanted.push("Berker Radio");
   }
   wanted.forEach(name=>{
     if(!g.items.some(i=>String(i.name).trim().toLowerCase()===name.toLowerCase()))
       g.items.push({name,count:0});
   });
 }));
 save();
}

function migrateSchukoStable(){
 data.customers.forEach(c=>(c.rooms||[]).forEach(r=>(r.groups||[]).forEach(g=>{
   if(!Array.isArray(g.items))return;
   let oldCount=0;
   g.items=g.items.filter(i=>{
     const n=String(i.name||"").trim().toLowerCase();
     const old=(n==="steckdose"||n==="steckdosen");
     if(old)oldCount+=Number(i.count||0);
     return !old;
   });
   if(g.title==="Schalter & Steckdosen"){
     let target=g.items.find(i=>String(i.name||"").trim().toLowerCase()==="schukosteckdose");
     if(!target){target={name:"Schukosteckdose",count:0};g.items.unshift(target);}
     if(oldCount>0)target.count=Number(target.count||0)+oldCount;
   }
 })));
 save();
}
migrateSchukoStable();


function isIOSDevice(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function isStandaloneMode(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}
function showInstallHintOnce(){
  if(!isIOSDevice()||isStandaloneMode())return;
  try{if(localStorage.getItem("esb_ipad_install_hint_v1"))return;localStorage.setItem("esb_ipad_install_hint_v1","1")}catch(e){}
  setTimeout(()=>{
    modal("Auf dem iPad installieren",`<p>Für die beste Nutzung in Safari auf <b>Teilen</b> tippen und <b>Zum Home-Bildschirm</b> wählen.</p><p style="font-size:13px;color:#64748b">Danach startet die ESB Zählliste wie eine eigene App und kann nach dem ersten Laden auch offline verwendet werden.</p>`,closeModal);
  },700);
}
render();
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
window.addEventListener("load",showInstallHintOnce);


function restoreAfterPrint(){
 if(!window.__esbPrintBackup)return;
 const ph=document.getElementById("printHead");
 if(ph)ph.innerHTML=window.__esbPrintBackup.html;
 document.title=window.__esbPrintBackup.title||"ESB Zählliste";
 document.body.classList.remove("esbPrinting");
 window.__esbPrintBackup=null;
 render();
}
let __esbPrintTriggeredAt=0;
window.addEventListener("blur",()=>{ if(window.__esbPrintBackup)__esbPrintTriggeredAt=Date.now(); });
window.addEventListener("focus",()=>{
 if(window.__esbPrintBackup && __esbPrintTriggeredAt && Date.now()-__esbPrintTriggeredAt>500){
   setTimeout(restoreAfterPrint,700);
 }
});
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible" && window.__esbPrintBackup && __esbPrintTriggeredAt && Date.now()-__esbPrintTriggeredAt>500){
   setTimeout(restoreAfterPrint,700);
 }
});
